<script>
    var Module = {
        onExit: () => {
            Module.canvas.style.display = "none";
            Module.setStatus("Thanks for playing!");
        },
        print: (() => {
            var element = document.getElementById('output');
            if (element) element.value = '';
            return (...args) => {
                var text = args.join(' ');
                console.log(text);
                if (element) {
                    if (element.value != "") element.value += '\n';
                    element.value += text;
                    element.scrollTop = element.scrollHeight;
                }
            };
        })(),
        canvas: document.getElementById('canvas'),
        setStatus: (text) => {
            var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
            if (m) {
                Module.progressElement.value = parseInt(m[2]);
                Module.progressElement.max = parseInt(m[4]);
                Module.progressElement.classList.remove('hidden');
            } else {
                if (text != "") console.log(text);
                Module.progressElement.value = null;
                Module.progressElement.max = null;
                Module.progressElement.classList.add('hidden');
            }
            Module.statusElement.innerHTML = text;
        },
        statusElement: document.getElementById('status'),
        progressElement: document.getElementById('progress')
    };
    Module.setStatus('Downloading...');
    window.onerror = () => {Module.setStatus('Exception thrown, see JavaScript console');};
</script>
