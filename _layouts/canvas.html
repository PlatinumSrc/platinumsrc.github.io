{%- include globals.liquid -%}
{%- capture title -%}
    {%- if page.section -%}
        {{- "PlatinumSrc: " | append: page.section | append: " - " | append: page.title -}}
    {%- else -%}
        {{- "PlatinumSrc - " | append: page.title -}}
    {%- endif -%}
{%- endcapture -%}
<!DOCTYPE html>
<html lang="en" bgcolor="{{ bg-color }}" style="height: 100%; background-color: {{ bg-color }};">
    <head>
        <title>{{ title }}</title>
        <link rel="icon" href="/assets/icon.png"></link>
        <meta charset="UTF-8">
        <meta name="description" content="PlatinumSrc">
        <meta property="og:title" content="{{ title }}">
        <meta property="og:description" content="PlatinumSrc GitHub Page">
        <meta property="og:image" content="{{ site.url }}/assets/mbedicon.png">
        <meta name="twitter:card" content="player">
        <meta name="twitter:title" content="{{ title }}">
        <meta name="twitter:description" content="PlatinumSrc GitHub Page">
        <meta name="twitter:image" content="{{ site.url }}/assets/icon.png">
        <meta name="twitter:player" content="{{ site.url }}{{ page.url }}">
        <meta name="twitter:player:width" content="{{ page.canvas-width }}">
        <meta name="twitter:player:height" content="{{ page.canvas-height }}">
        <meta name="theme-color" content="#5f8bc3">
        <link rel="stylesheet" href="/base.css">
        <script src="/base.js"></script>
    </head>
    <body bgcolor="{{ bg-color }}" style="height: 100%; background-color: {{ bg-color }};" background="/assets/bg.png">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1 style="width: 100%; height: 100%;"></canvas>
        <script>var Module = {canvas: document.getElementById('canvas')};</script>
        {{- content -}}
        <style>html {background-color: transparent !important;}</style>
    </body>
</html>
