{%- include globals.liquid -%}
<!DOCTYPE html>
<html lang="en" bgcolor="{{ bg-color }}" style="height: 100%; background-color: {{ bg-color }};">
    <head>
        <title>{{ title }}</title>
        <meta charset="UTF-8">
        {%- include meta.liquid -%}
        <link rel="icon" href="/assets/icon.png">
        <link rel="stylesheet" href="/base.css">
        <script src="/base.js"></script>
    </head>
    <body bgcolor="{{ bg-color }}" style="height: 100%; background-color: {{ bg-color }};" background="/assets/bg.png">
        <table class="container" style="width: 100%; height: 100%;">
            <tbody class="container">
                <tr class="container">
                    <td class="container">
                        <div style="height: 0.5em;"></div>
                    </td>
                </tr>
                <tr class="container" style="height: 100%;">
                    <td rowspan=2 class="container">
                        <div style="width: 0.5em;"></div>
                    </td>
                    <td rowspan=2 class="container" id="_sidebar">
                        <div class="sidebarcontainer">
                            {%- include sidebar.html -%}
                        </div>
                    </td>
                    <td rowspan=2 class="container">
                        <div style="width: 0.5em;"></div>
                    </td>
                    <td class="container" style="width: 100%; position: relative;">
                        <div id="_header">
                            {%- include header.html -%}
                        </div>
                        <div style="height: 0.5em;"></div>
                        <div id="_content">
                            {{- content -}}
                        </div>
                        <div style="height: 0.5em;"></div>
                    </td>
                    <td class="container">
                        <div style="width: 0.5em;"></div>
                    </td>
                </tr>
                <tr class="container">
                    <td class="container" style="vertical-align: bottom;">
                        <div id="_footer">
                            {%- include footer.html -%}
                        </div>
                    </td>
                </tr>
                <tr class="container">
                    <td class="container">
                        <div style="height: 0.5em;"></div>
                    </td>
                </tr>
            </tbody>
        </table>
        <script defer>setup();</script>
        <style>html {background-color: transparent !important;}</style>
    </body>
</html>
